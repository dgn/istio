  key:gateway.istio.io/controller-version: internal bookkeeping annotation written
    by istiod onto Gateways; not user-facing behavior
  label:gateway.istio.io/managed: set by the gateway deployment controller on generated
    resources to mark ownership; not user configuration
  label:gateway.networking.k8s.io/gateway-class-name: set by the gateway deployment
    controller on generated resources; checked by infra.standard-labels on pods, not
    proxy behavior
  label:gateway.networking.k8s.io/gateway-name: set by the gateway deployment controller
    on generated resources; checked by infra.standard-labels on pods, and used by
    features to select gateway pods
  label:istio.io/rev: selects the control plane revision that injects or programs
    the resource (installation); not proxy behavior
  label:networking.istio.io/gatewayPort: 'multicluster/multi-network: needs several
    clusters or networks; the suite runs a single cluster and network'
  label:operator.istio.io/*: installation bookkeeping on resources installed by the
    operator/istioctl; no effect on proxies
  label:sidecar.istio.io/inject: selects sidecar injection (istiod webhook, installation);
    the sidecar role deploys injected workloads by construction
  label:topology.istio.io/cluster: 'multicluster/multi-network: needs several clusters
    or networks; the suite runs a single cluster and network'
  label:topology.istio.io/network: 'multicluster/multi-network: needs several clusters
    or networks; the suite runs a single cluster and network'
