# API surface the proxy conformance suite deliberately does not cover, with the reason.
# Checked by TestCoverage (go test ./tests/conformance/proxy/coverage/). Every reason must
# be real: uncovered surface without an exemption is the backlog, which is derived (status "todo" in
# coverage.yaml) and bounded by maxTodo in ratchets.yaml.
#
# - Entries ending in "*" exempt every entry with that prefix: "<Kind>.<path>.*" a whole subtree
#   (e.g. sidecar-only MeshConfig sections), "annotation:<prefix>*" an annotation family.
# - "key:<string>" entries exempt Istio-specific keys found in the Gateway API translators.
# - Run TestCoverage with -update to drop stale or redundant (covered) entries.
exempt:
  DestinationRule.trafficPolicy.connectionPool.http.http2KeepAlive*: 'TODO: HTTP/2
    PING keepalives have no effect echo can observe; needs a backend that reports
    the PING frames it receives on an idle connection'
  DestinationRule.trafficPolicy.connectionPool.http.idleTimeout: 'TODO: observable
    through the gateway''s upstream cluster stats (scrape with the proxyStatsMatcher
    annotation, as istioapi.gateway.server-name does): upstream_cx_idle_timeout after
    an idle pause between requests'
  DestinationRule.trafficPolicy.connectionPool.http.maxRequestsPerConnection: 'TODO:
    observable through the gateway''s upstream cluster stats (scrape with the proxyStatsMatcher
    annotation, as istioapi.gateway.server-name does): upstream_cx_max_requests after
    more requests than the limit'
  DestinationRule.trafficPolicy.connectionPool.http.maxRetries: 'TODO: observable
    through the gateway''s upstream cluster stats (scrape with the proxyStatsMatcher
    annotation, as istioapi.gateway.server-name does): upstream_rq_retry_overflow
    with concurrent retries against a failing backend'
  DestinationRule.trafficPolicy.connectionPool.tcp.idleTimeout: 'TODO: observable
    through the gateway''s upstream cluster stats (scrape with the proxyStatsMatcher
    annotation, as istioapi.gateway.server-name does): upstream_cx_idle_timeout after
    an idle pause on a TCP connection'
  DestinationRule.trafficPolicy.connectionPool.tcp.maxConnectionDuration: 'TODO: observable
    through the gateway''s upstream cluster stats (scrape with the proxyStatsMatcher
    annotation, as istioapi.gateway.server-name does): upstream_cx_max_duration_reached
    on a connection held past the limit'
  DestinationRule.trafficPolicy.connectionPool.tcp.tcpKeepalive*: 'TODO: tcpKeepalive
    sets socket options (SO_KEEPALIVE, TCP_KEEPIDLE/INTVL/CNT) with no effect echo
    can observe; needs a workload that holds an idle connection open and reports the
    keepalive probes it receives'
  DestinationRule.trafficPolicy.loadBalancer.backendUtilization*: 'TODO: needs a backend
    that sends ORCA load reports; echo does not'
  DestinationRule.trafficPolicy.loadBalancer.simple: 'TODO: the simple balancers all
    spread sequential requests evenly, so black-box they are indistinguishable from
    the default; needs distinguishing setups (e.g. a slow endpoint under concurrent
    load for LEAST_REQUEST)'
  DestinationRule.trafficPolicy.loadBalancer.simple=LEAST_REQUEST: 'TODO: distinguishable
    from ROUND_ROBIN/RANDOM only under concurrent load with one slow endpoint, which
    should then get fewer requests'
  DestinationRule.trafficPolicy.loadBalancer.simple=RANDOM: 'TODO: a random spread
    is not distinguishable black-box from the default balancer; would need a statistical
    test against a strict per-connection alternation'
  DestinationRule.trafficPolicy.loadBalancer.simple=ROUND_ROBIN: 'TODO: not reliably
    distinguishable from the default; Envoy keeps per-worker LB state, so even round
    robin does not strictly alternate'
  DestinationRule.trafficPolicy.loadBalancer.warmup*: 'statistical: slow start ramps
    the traffic share of a new endpoint over time; asserting the ramp needs many requests
    and timing tolerances that make the test flaky'
  DestinationRule.trafficPolicy.loadBalancer.zoneAwareLbSetting.minClusterSize: 'TODO:
    testable as a contrast to backend.destinationrule.zone-aware: a minClusterSize
    above the endpoint count turns zone-aware routing off, spreading traffic across
    zones'
  DestinationRule.trafficPolicy.outlierDetection.failurePercentageThreshold: 'TODO:
    Envoy applies failure-percentage ejection only with at least 5 hosts (failure_percentage_minimum_hosts);
    needs a backend with 5 or more replicas'
  DestinationRule.trafficPolicy.retryBudget*: 'TODO: observable through the gateway''s
    upstream cluster stats (scrape with the proxyStatsMatcher annotation, as istioapi.gateway.server-name
    does): upstream_rq_retry_overflow with concurrent retries against a failing backend'
  DestinationRule.trafficPolicy.tunnel*: 'TODO: needs an HTTP CONNECT proxy workload
    as the tunnel target'
