    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  covers:
    - MeshConfig.defaultHttpRetryPolicy
    - MeshConfig.defaultHttpRetryPolicy.attempts
    - MeshConfig.defaultHttpRetryPolicy.retryOn
  noControl: false
