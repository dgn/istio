    - ServiceEntry.subjectAltNames
    - ServiceEntry.endpoints.labels
    - ServiceEntry.location=MESH_INTERNAL
  noControl: false
- id: backend.serviceentry.endpoint-labels-subset
  description: A DestinationRule subset of a ServiceEntry host selects the endpoints whose ServiceEntry endpoints.labels match.
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  covers:
    - ServiceEntry.endpoints.labels
  noControl: false
- id: backend.serviceentry.endpoint-weight
  description: ServiceEntry endpoints.weight splits traffic between the endpoints of a STATIC ServiceEntry in proportion.
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  covers:
    - ServiceEntry.endpoints.weight
    - ServiceEntry.endpoints.address
    - ServiceEntry.location
    - ServiceEntry.location=MESH_EXTERNAL
    - ServiceEntry.resolution
    - ServiceEntry.ports.name
    - ServiceEntry.ports.number
    - ServiceEntry.ports.protocol
  noControl: false
- id: backend.serviceentry.hostname-backendref
  description: An HTTPRoute backendRef of kind Hostname (networking.istio.io) routes to a ServiceEntry host.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - gateway-api-ext:backendref-kind:networking.istio.io/Hostname
    - ServiceEntry.hosts
    - ServiceEntry.resolution=DNS
    - ServiceEntry.endpoints
    - ServiceEntry.endpoints.address
    - ServiceEntry.ports
    - ServiceEntry.location=MESH_EXTERNAL
  noControl: false
- id: backend.serviceentry.same-host-as-service
  description: 'A ServiceEntry with the same hostname (and namespace) as a Kubernetes Service does not take it over: routes to the Service keep reaching its pods, not the ServiceEntry''s endpoints.'
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - interaction:serviceentry.same-host-as-service
  noControl: false
- id: backend.serviceentry.static-endpoints
  description: A ServiceEntry with STATIC resolution and explicit endpoint IPs is routable through the gateway.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ServiceEntry.resolution=STATIC
    - ServiceEntry.ports.targetPort
  noControl: false
- id: backend.serviceentry.workload-selector
  description: A MESH_INTERNAL ServiceEntry with a workloadSelector uses the selected pods as its endpoints.
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  covers:
    - ServiceEntry.workloadSelector
    - ServiceEntry.workloadSelector.labels
    - ServiceEntry.location=MESH_INTERNAL
    - interaction:serviceentry.workload-selector
  noControl: false
- id: backend.workloadentry.locality
  description: 'WorkloadEntry locality places the entry for locality load balancing: all traffic goes to the entry in the gateway''s locality.'
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
    - WorkloadEntry.locality
  noControl: false
- id: backend.workloadentry.ports-labels
  description: A ServiceEntry workloadSelector selects WorkloadEntries by labels; traffic reaches each entry's address on the target port its ports map gives the ServiceEntry port name.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - WorkloadEntry.address
    - WorkloadEntry.labels
    - WorkloadEntry.ports
  noControl: false
- id: dataplane.access-log-text
  description: With the default accessLogEncoding TEXT, the gateway writes access log lines in Istio's default text format.
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
    - MeshConfig.accessLogEncoding=TEXT
  noControl: false
- id: dataplane.default-retry-on-connect-failure
  description: Without explicit retry config, requests are retried on connection failure (Istio default retry policy), so a single unavailable endpoint does not cause errors.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.default-retry-on-connect-failure.mesh
  description: Without explicit retry config, a mesh proxy retries requests on connection failure (Istio default retry policy), so a single unavailable endpoint does not cause errors.
  roles:
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.expect-continue-proxied
  description: 'An Expect: 100-continue request header is forwarded to the backend (the backend, not the proxy, decides whether to continue).'
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.grpc-timeout-honored
  description: A gRPC request's grpc-timeout header bounds the request at the proxy even though the route has no timeout; Envoy reports DEADLINE_EXCEEDED (4) or UNAVAILABLE (14) depending on its runtime guard, and without the header the slow request succeeds.
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.host-case-insensitive
  description: Host matching is case-insensitive.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.host-port-ignored
  description: A Host header with a port (host:port) still matches routes for the bare hostname.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.inbound-passthrough
  description: With the default inboundTrafficPolicy PASSTHROUGH, a meshed workload's proxy forwards traffic for a port no Service declares to the application.
  roles:
    - sidecar
  profile: core
  requiresL7: false
  security: false
  covers:
    - MeshConfig.inboundTrafficPolicy.mode=PASSTHROUGH
  noControl: false
- id: dataplane.inbound-source-address
  description: A sidecar forwards inbound requests to the application from 127.0.0.6, so the application can tell proxied traffic from its own outbound traffic.
  roles:
    - sidecar
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.no-default-route-timeout
  description: 'Routes have no timeout by default: a response slower than Envoy''s built-in 15s route timeout still succeeds, while the same request through a route with an explicit 15s timeout fails with 504.'
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.no-h2-upgrade
  description: With the default h2UpgradePolicy DO_NOT_UPGRADE, the gateway forwards HTTP/1.1 requests to an HTTP/1.1-declared backend as HTTP/1.1.
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
    - MeshConfig.h2UpgradePolicy=DO_NOT_UPGRADE
  noControl: false
- id: dataplane.no-route-404
  description: Requests for a hostname with no route are answered with 404 by the gateway.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.outbound-allow-any
  description: With the default outboundTrafficPolicy ALLOW_ANY, a meshed client reaches an address:port no service declares (passthrough).
  roles:
    - sidecar
  profile: core
  requiresL7: false
  security: false
  covers:
    - MeshConfig.outboundTrafficPolicy.mode=ALLOW_ANY
  noControl: false
- id: dataplane.path-normalization
  description: Paths are normalized (dot segments resolved) before route matching, so /x/../admin matches a /admin route.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.path-normalization.mesh
  description: A mesh proxy normalizes paths (dot segments resolved) before route matching, so /x/../admin matches a /admin route.
  roles:
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.permissive-mtls-default
  description: Without PeerAuthentication, meshed workloads accept both mTLS from meshed clients and plaintext from clients outside the mesh (PERMISSIVE).
  roles:
    - node
    - sidecar
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.proxy-protocol.downstream
  description: gatewayTopology.proxyProtocol makes the gateway accept (and require) a PROXY protocol header from clients (tested on a TCP listener; echo only sends PROXY headers over raw TCP).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.proxyProtocol
  noControl: false
- id: dataplane.proxy-protocol.upstream
  description: A DestinationRule proxyProtocol setting makes the gateway send a PROXY header to the backend.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - DestinationRule.trafficPolicy.proxyProtocol
    - DestinationRule.trafficPolicy.proxyProtocol.version=V1
  noControl: false
- id: dataplane.request-id
  description: The gateway generates an X-Request-Id (used by Istio for tracing/log correlation); as an edge proxy it replaces any client-supplied value.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.request-id.mesh-preserved
  description: A mesh proxy generates X-Request-Id when the client sends none, and preserves a client-supplied one (only edge proxies replace it).
  roles:
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.trace-context-propagation
  description: W3C trace context from the client is propagated to the backend (same trace id).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.trace-context-propagation.mesh
  description: W3C trace context from the client is propagated through the mesh proxy to the backend (same trace id).
  roles:
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.x-forwarded-proto
  description: The backend sees X-Forwarded-Proto reflecting the client's scheme.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.xfcc.always-forward-only
  description: gatewayTopology.forwardClientCertDetails ALWAYS_FORWARD_ONLY forwards a client-supplied X-Forwarded-Client-Cert even on plaintext connections (APPEND_FORWARD only does so for mTLS clients).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=ALWAYS_FORWARD_ONLY
  noControl: false
- id: dataplane.xfcc.mesh-client-identity
  description: The backend's proxy passes the client's mesh identity to the application in X-Forwarded-Client-Cert (URI=spiffe://...), replacing a client-supplied value.
  roles:
    - sidecar
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.xfcc.mode-append-forward
  description: gatewayTopology.forwardClientCertDetails APPEND_FORWARD appends the client certificate's details to the client's X-Forwarded-Client-Cert.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=APPEND_FORWARD
  noControl: false
- id: dataplane.xfcc.mode-forward-only
  description: gatewayTopology.forwardClientCertDetails FORWARD_ONLY forwards the client's X-Forwarded-Client-Cert unchanged on mTLS connections.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=FORWARD_ONLY
  noControl: false
- id: dataplane.xfcc.mode-sanitize
  description: gatewayTopology.forwardClientCertDetails SANITIZE drops X-Forwarded-Client-Cert.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=SANITIZE
  noControl: false
- id: dataplane.xfcc.mode-sanitize-set
  description: gatewayTopology.forwardClientCertDetails SANITIZE_SET replaces the client's X-Forwarded-Client-Cert with the client certificate's details.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=SANITIZE_SET
  noControl: SANITIZE_SET is the gateway default (pilot buildGatewayConnectionManager), so the gateway behaves the same without the annotation; the client X-Forwarded-Client-Cert being replaced is checked instead.
- id: dataplane.xfcc.mode-undefined
  description: gatewayTopology.forwardClientCertDetails UNDEFINED behaves like the gateway default, SANITIZE_SET.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - ProxyConfig.gatewayTopology.forwardClientCertDetails=UNDEFINED
  noControl: SANITIZE_SET is the gateway default (pilot buildGatewayConnectionManager), so the gateway behaves the same without the annotation; the client X-Forwarded-Client-Cert being replaced is checked instead.
- id: dataplane.xfcc.sanitize
  description: A client-supplied X-Forwarded-Client-Cert is not forwarded (gateways sanitize XFCC by default).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.xff.append-client-ip
  description: The gateway appends the client's address to X-Forwarded-For.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: dataplane.xff.mesh-preserved
  description: A mesh proxy forwards a client-supplied X-Forwarded-For unchanged and adds none of its own (only edge proxies use the remote address).
  roles:
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  noControl: false
- id: dataplane.xff.num-trusted-proxies
  description: gatewayTopology.numTrustedProxies (proxy.istio.io/config on the Gateway) makes the gateway trust X-Forwarded-For hops for the client address.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - annotation:proxy.istio.io/config
    - ProxyConfig.gatewayTopology
    - ProxyConfig.gatewayTopology.numTrustedProxies
  noControl: false
- id: dataplane.xff.untrusted-by-default
  description: By default (numTrustedProxies=0), a client-supplied X-Forwarded-For does not change the client address used for authorization.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: egress.authz.l7-path
  description: An AuthorizationPolicy on the egress gateway rejects only the denied path.
  roles:
    - egress
  profile: core
  requiresL7: false
  security: true
  covers:
    - AuthorizationPolicy.selector
    - AuthorizationPolicy.selector.matchLabels
    - AuthorizationPolicy.action=DENY
    - AuthorizationPolicy.rules.to.operation.hosts
    - AuthorizationPolicy.rules.to.operation.paths
  noControl: false
- id: egress.baseline.via-gateway
  description: A meshed client reaches an external host through the egress gateway.
  roles:
    - egress
  profile: core
  requiresL7: false
  security: false
  covers:
    - Gateway.selector
    - Gateway.servers.hosts
    - Gateway.servers.port
    - Gateway.servers.port.number
    - Gateway.servers.port.protocol
    - VirtualService.hosts
    - VirtualService.gateways
    - VirtualService.http.match.gateways
    - VirtualService.http.route.destination.host
    - VirtualService.http.route.destination.port
    - ServiceEntry.hosts
    - ServiceEntry.location=MESH_EXTERNAL
    - ServiceEntry.resolution=DNS
    - ServiceEntry.endpoints.address
  noControl: false
- id: egress.tcp.via-gateway
  description: The egress gateway forwards raw TCP to an external service without protocol decoding.
  roles:
    - egress
  profile: core
  requiresL7: false
  security: false
  covers:
    - Gateway.servers.port.protocol
    - VirtualService.tcp.match.gateways
    - ServiceEntry.location
    - ServiceEntry.resolution
    - ServiceEntry.ports.name
    - ServiceEntry.ports.number
    - ServiceEntry.ports.protocol
  noControl: false
- id: egress.tls-origination.ca
  description: The egress gateway originates TLS to the external server and verifies it against a CA served through credentialName.
  roles:
    - egress
  profile: core
  requiresL7: false
  security: false
  covers:
    - DestinationRule.host
    - DestinationRule.trafficPolicy.tls.mode
    - DestinationRule.trafficPolicy.tls.credentialName
  noControl: false
- id: egress.tls-origination.untrusted
  description: TLS origination with a subjectAltNames that does not match the external certificate fails with 503 instead of connecting.
  roles:
    - egress
  profile: core
  requiresL7: false
  security: false
  covers:
    - DestinationRule.trafficPolicy.tls.subjectAltNames
  noControl: false
- id: flag.100-continue-disabled
  description: 'With ENABLE_100_CONTINUE_HEADERS=false the proxy answers Expect: 100-continue itself and does not forward the Expect header to the backend.'
  roles:
    - ingress
    - sidecar
    - waypoint
  profile: core
  requiresL7: true
  security: false
  covers:
    - flag:istiod:ENABLE_100_CONTINUE_HEADERS
  noControl: false
- id: flag.persistent-session
  description: 'With PILOT_ENABLE_PERSISTENT_SESSION_FILTER, a Service labeled with PILOT_PERSISTENT_SESSION_LABEL (cookie) or PILOT_PERSISTENT_SESSION_HEADER_LABEL (header) gets sticky sessions: the proxy returns a session cookie or header, and requests carrying it keep reaching the same endpoint.'
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - flag:istiod:PILOT_ENABLE_PERSISTENT_SESSION_FILTER
    - flag:istiod:PILOT_PERSISTENT_SESSION_LABEL
    - flag:istiod:PILOT_PERSISTENT_SESSION_HEADER_LABEL
  noControl: false
- id: flag.pilot-http10
  description: istiod flag PILOT_HTTP10 makes the proxy accept HTTP/1.0 requests (rejected with 426 by default).
  roles:
    - ingress
    - sidecar
  profile: core
  requiresL7: true
  security: false
  covers:
    - flag:istiod:PILOT_HTTP10
  noControl: false
- id: flag.pilot-jwt-enable-remote-jwks
  description: With PILOT_JWT_ENABLE_REMOTE_JWKS=envoy the proxy fetches a jwksUri served by a mesh service itself, so a JWKS host only the mesh can resolve (a ServiceEntry) works.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - flag:istiod:PILOT_JWT_ENABLE_REMOTE_JWKS
  noControl: false
- id: impl-specific.envoyfilter
  description: '[Envoy-specific extension API] An EnvoyFilter selecting the gateway pods patches its config (adds a response header).'
  roles:
    - ingress
  profile: impl-specific
  requiresL7: false
  security: false
  noControl: false
- id: impl-specific.trafficextension-lua
  description: '[Envoy-specific extension API] A Lua TrafficExtension targeting the gateway runs (adds a response header).'
  roles:
    - ingress
  profile: impl-specific
  requiresL7: false
  security: false
  noControl: false
- id: infra.addresses-hostname-manual-deployment
  description: A Gateway with a Hostname address binds to an existing gateway Service's pods instead of deploying its own.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - gateway-api-ext:addresses-hostname-manual-deployment
  noControl: false
- id: infra.gateway-metadata-copied
  description: Without spec.infrastructure, the Gateway's own labels and annotations are copied to generated resources.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: infra.gatewayclass-defaults-configmap
  description: A ConfigMap in the root namespace labeled gateway.istio.io/defaults-for-class=<class> applies overlays to every gateway of that class.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - gateway-api-ext:gatewayclass-defaults-configmap:gateway.istio.io/defaults-for-class
  noControl: false
- id: infra.name-override-annotation
  description: The gateway.istio.io/name-override annotation sets the name of the generated Deployment and Service.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - annotation:gateway.istio.io/name-override
  noControl: false
- id: infra.owner-references
  description: Generated Deployment and Service are owned by the Gateway (garbage-collected with it).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: infra.parametersref-configmap
  description: spec.infrastructure.parametersRef to a ConfigMap overlays the generated Deployment and Service.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - gateway-api-ext:parametersref-overlay:deployment
    - gateway-api-ext:parametersref-overlay:service
  noControl: false
- id: infra.parametersref-hpa-pdb-serviceaccount
  description: parametersRef overlays for horizontalPodAutoscaler, podDisruptionBudget and serviceAccount create/patch those resources.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - gateway-api-ext:parametersref-overlay:horizontalPodAutoscaler
    - gateway-api-ext:parametersref-overlay:podDisruptionBudget
    - gateway-api-ext:parametersref-overlay:serviceAccount
  noControl: false
- id: infra.reconcile-drift
  description: Generated resources removed out-of-band (the gateway Service) are recreated by the controller.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: infra.service-account-annotation
  description: The gateway.istio.io/service-account annotation sets the gateway pods' service account (and thus mesh identity).
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - annotation:gateway.istio.io/service-account
  noControl: false
- id: infra.service-ports-from-listeners
  description: The generated Service exposes one port per distinct listener port.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: infra.service-type-annotation
  description: The networking.istio.io/service-type annotation sets the generated Service type.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - annotation:networking.istio.io/service-type
  noControl: false
- id: infra.standard-labels
  description: Gateway pods carry the standard gateway-name and gateway-class-name labels.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  noControl: false
- id: istioapi.gateway-api.httproute-and-virtualservice
  description: 'An HTTPRoute (on a Gateway API Gateway) and a VirtualService (on an Istio Gateway selecting the same pods) for the same host and port are merged: each one''s rules route their own paths.'
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - interaction:gatewayapi.route-vs-virtualservice
  noControl: false
- id: istioapi.gateway-virtualservice.route
  description: An Istio Gateway selecting the gateway pods plus a VirtualService routes traffic.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - Gateway.selector
    - Gateway.servers
    - Gateway.servers.port
    - Gateway.servers.hosts
    - VirtualService.hosts
    - VirtualService.gateways
    - VirtualService.http
    - VirtualService.http.route
    - VirtualService.http.route.destination
  noControl: false
- id: istioapi.gateway.https-redirect
  description: Istio Gateway server tls.httpsRedirect answers plaintext requests with a 301 to https.
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - Gateway.servers.tls
    - Gateway.servers.tls.httpsRedirect
  noControl: false
- id: istioapi.gateway.same-port-tls-conflict
  description: 'When two Istio Gateway resources declare a TLS server for the same host and port, the older one is kept: the newer Gateway''s conflicting server is ignored while its other servers apply.'
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - interaction:gateway.same-port-tls-conflict
  noControl: false
- id: istioapi.gateway.server-bind
  description: 'Istio Gateway servers.bind binds the server''s listener to that address only: a server bound to the pod IP is reachable on it, one bound to 127.0.0.1 is not reachable from outside the gateway.'
  roles:
    - ingress
  profile: core
  requiresL7: false
  security: false
  covers:
    - Gateway.servers.bind
