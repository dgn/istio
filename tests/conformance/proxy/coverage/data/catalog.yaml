    - ingress
  profile: core
  requiresL7: false
  security: true
  covers:
    - interaction:mtls.gateway-to-restricted-sidecar
  noControl: meshMTLS applies only to the server side of mesh mTLS (pilot BuildInboundTLS); a gateway's ISTIO_MUTUAL upstream always offers TLS 1.3 (defaultUpstreamCommonTLSContext), where cipherSuites do not apply, so no gateway request is refused with or without it and the echo client cannot cap its TLS version to probe the sidecar itself.
