  description: 'MeshConfig defaultServiceExportTo [.] keeps services without exportTo private to their namespace: a gateway cannot route to one from another namespace, but can to an explicitly exported one.'
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
    - MeshConfig.defaultServiceExportTo
  noControl: false
