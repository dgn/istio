  description: 'MeshConfig defaultVirtualServiceExportTo [.] keeps VirtualServices without exportTo private to their namespace: a gateway does not use one bound to it from another namespace, but uses an explicitly exported one.'
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
