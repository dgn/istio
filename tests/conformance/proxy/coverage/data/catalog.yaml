  description: MeshConfig pathNormalization DECODE_AND_MERGE_SLASHES decodes escaped slashes and merges repeated slashes.
  roles:
    - ingress
  profile: core
  requiresL7: true
  security: false
  covers:
    - MeshConfig.pathNormalization.normalization=DECODE_AND_MERGE_SLASHES
  noControl: false
