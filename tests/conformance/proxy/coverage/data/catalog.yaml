    - ProxyConfig.connectionSettings.httpHeadersWithUnderscoresAction=HEADERS_WITH_UNDERSCORES_DROP_HEADER
    - ProxyConfig.connectionSettings.httpHeadersWithUnderscoresAction=HEADERS_WITH_UNDERSCORES_ALLOW
